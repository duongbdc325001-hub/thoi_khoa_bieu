      border: 1px solid #e2e8f0;

      font-size: 14px;

      background: #eff6ff;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #cbd5e1;
      text-align: center;
      padding: 6px;
      height: 50px;
      vertical-align: middle;
    }
    th {
      background-color: #1e3a8a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }
    .session-separator {
      background-color: #f1f5f9;
      font-weight: bold;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tiet-col {
      background-color: #f8fafc;
      font-weight: bold;
      width: 85px;
      color: #475569;
      font-size: 13px;
    }
    .cell-occupied {
      background-color: #e0f2fe;
      border: 1px solid #7dd3fc;
      border-radius: 6px;
      padding: 4px 6px;
      margin: 2px 0;
      text-align: center;
    }
    .cell-afternoon {
      background-color: #fef3c7;
      border-color: #fcd34d;
    }
    .cell-afternoon .cell-subject {
      color: #b45309;
    }
    .cell-subject {
      font-weight: 700;
      color: #0369a1;
      font-size: 13px;
    }
    .cell-class {
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      margin-top: 2px;
    }
    .print-btn {
      padding: 8px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

      background: #0369a1;
    }

  const subjectMap = {
    't': 'Toán', 'toan': 'Toán', 'trn': 'Trải nghiệm', 'gddp': 'GD địa phương',
    'v': 'Ngữ văn', 'van': 'Ngữ văn', 'a': 'Tiếng Anh', 'ta': 'Tiếng Anh',
    'anh': 'Tiếng Anh', 'l': 'Vật lý', 'ly': 'Vật lý', 'h': 'Hóa học',
    'hoa': 'Hóa học', 'sin': 'Sinh học', 'sinh': 'Sinh học', 's': 'Sinh học',
    'su': 'Lịch sử', 'd': 'Địa lý', 'dia': 'Địa lý', 'ktpl': 'GDKT & PL',
    'qpan': 'GDQP - AN', 'qp': 'GDQP - AN', 'tin': 'Tin học', 'cn': 'Công nghệ',
    'gdtc': 'GD Thể chất', 'td': 'Thể dục', 'p': 'Tiếng Pháp', 'n': 'Tiếng Nga',
    'tq': 'Tiếng Trung', 'sh': 'Sinh hoạt', 'cc': 'Chào cờ'
  };

  let scheduleData = [];
  let allTeachersList = [];

  // Khởi tạo lưới bảng: Sáng 5 tiết (1->5) và Chiều 4 tiết (1->4 quy ước là 6->9)
  function buildEmptyGrid() {
    const tbody = document.getElementById('scheduleBody');
    tbody.innerHTML = '';

    // Buổi Sáng
    const trHeaderSang = document.createElement('tr');
    trHeaderSang.innerHTML = `<td colspan="7" class="session-separator">☀️ BUỔI SÁNG</td>`;
    tbody.appendChild(trHeaderSang);

    for (let tiet = 1; tiet <= 5; tiet++) {
      const tr = document.createElement('tr');
      let rowHtml = `<td class="tiet-col">Tiết ${tiet}</td>`;
      for (let thu = 2; thu <= 7; thu++) {
        rowHtml += `<td id="cell-${thu}-${tiet}"></td>`;
      }
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    }

    // Buổi Chiều
    const trHeaderChieu = document.createElement('tr');
    trHeaderChieu.innerHTML = `<td colspan="7" class="session-separator">🌤️ BUỔI CHIỀU</td>`;
    tbody.appendChild(trHeaderChieu);

    for (let tietChieu = 1; tietChieu <= 4; tietChieu++) {
      const gridRowKey = 5 + tietChieu; // 6, 7, 8, 9
      const tr = document.createElement('tr');
      let rowHtml = `<td class="tiet-col">Tiết ${tietChieu} (C)</td>`;
      for (let thu = 2; thu <= 7; thu++) {
        rowHtml += `<td id="cell-${thu}-${gridRowKey}"></td>`;
      }
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    }
  }

  function parseCSVLine(textLine) {
    const res = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < textLine.length; i++) {
      const c = textLine[i];
      if (c === '"') {
        inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        res.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    res.push(cur.trim());
    return res;
  }

  function parseLessonCell(cellText) {
    if (!cellText || typeof cellText !== 'string') return null;
    const clean = cellText.replace(/^["']|["']$/g, '').trim();
    if (!clean.includes('-')) return null;

    const parts = clean.split('-');
    const monCode = parts[0].trim();
    const gvName = parts.slice(1).join('-').trim();
    if (!gvName) return null;

    const monKey = monCode.toLowerCase();
    const monName = subjectMap[monKey] || monCode;
    return { teacher: gvName, subject: monName };
  }

  function parseSchoolTKB(csvContent) {
    const lines = csvContent.split(/\r?\n/).filter(l => l.trim() !== '');
    const rows = lines.map(parseCSVLine);

    // Xác định Buổi Sáng hay Buổi Chiều từ 3 dòng đầu
    let isAfternoon = false;
    for (let i = 0; i < Math.min(4, rows.length); i++) {
      const lineStr = rows[i].join(' ').toLowerCase();
      if (lineStr.includes('chiều') || lineStr.includes('chieu')) {
        isAfternoon = true;
        break;
      }
    }

    // Tìm dòng header
    let headerRowIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const hasThu = row.some(c => c.toLowerCase().includes('thứ'));
      const hasTiet = row.some(c => c.toLowerCase().includes('tiết'));
      if (hasThu && hasTiet) {
        headerRowIdx = i;
        break;
      }
    }
    if (headerRowIdx === -1) return [];

    const headerRow = rows[headerRowIdx];
    let thuColIdx = headerRow.findIndex(c => c.toLowerCase().includes('thứ'));
    let tietColIdx = headerRow.findIndex(c => c.toLowerCase().includes('tiết'));
    let firstClassColIdx = Math.max(thuColIdx, tietColIdx) + 1;

    const buoiColIdx = headerRow.findIndex(c => c.toLowerCase().includes('buổi'));
    if (buoiColIdx !== -1) {
      firstClassColIdx = Math.max(firstClassColIdx, buoiColIdx + 1);
    }

    const classNames = [];
    for (let col = firstClassColIdx; col < headerRow.length; col++) {
      classNames[col] = headerRow[col] ? headerRow[col].trim() : '';
    }

    const records = [];
    let currentThu = null;

    for (let r = headerRowIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.length <= firstClassColIdx) continue;

      const rawThu = row[thuColIdx] ? row[thuColIdx].trim() : '';
      if (rawThu) {
        const matchThu = rawThu.match(/\d+/);
        if (matchThu) currentThu = parseInt(matchThu[0], 10);
      }

      const rawTiet = row[tietColIdx] ? row[tietColIdx].trim() : '';
      const tietNum = parseInt(rawTiet, 10);
      if (!currentThu || isNaN(tietNum) || tietNum < 1 || tietNum > 5) continue;

      // Chiều: tiết 1->4 chuyển thành slot hàng 6->9
      const gridRowSlot = isAfternoon ? (5 + tietNum) : tietNum;

      for (let c = firstClassColIdx; c < row.length; c++) {
        const cellValue = row[c];
        const lop = classNames[c];
        if (!cellValue || !lop) continue;

        const parsed = parseLessonCell(cellValue);
        if (parsed && parsed.teacher) {
          records.push({
            teacher: parsed.teacher,
            subject: parsed.subject,
            className: lop,
            thu: currentThu,
            gridSlot: gridRowSlot,
            isAfternoon: isAfternoon,
            originalTiet: tietNum
          });
        }
      }
    }
    return records;
  }

  function filterTeacherDropdown(keyword = '') {
    const select = document.getElementById('teacherSelect');
    const currentSelected = select.value;
    select.innerHTML = '';

    const normalizedKw = keyword.toLowerCase().trim();
    const filteredTeachers = allTeachersList.filter(t => t.toLowerCase().includes(normalizedKw));

    if (filteredTeachers.length === 0) {
      select.innerHTML = '<option value="">-- Không tìm thấy --</option>';
      renderScheduleForTeacher('');
      return;
    }

    filteredTeachers.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      select.appendChild(opt);
    });

    if (filteredTeachers.includes(currentSelected)) {
      select.value = currentSelected;
      renderScheduleForTeacher(currentSelected);
    } else {
      select.value = filteredTeachers[0];
      renderScheduleForTeacher(filteredTeachers[0]);
    }
  }

  function renderScheduleForTeacher(teacherName) {
    buildEmptyGrid();
    if (!teacherName) {
      document.getElementById('totalLessons').textContent = `Tổng số tiết: 0`;
      document.getElementById('pageHeading').textContent = `Thời Khóa Biểu Giảng Dạy`;
      return;
    }

    document.getElementById('pageHeading').textContent = `Thời Khóa Biểu Giảng Dạy - GV: ${teacherName}`;
    const filtered = scheduleData.filter(r => r.teacher === teacherName);
    document.getElementById('totalLessons').textContent = `Tổng số tiết: ${filtered.length}`;

    filtered.forEach(item => {
      if (item.thu >= 2 && item.thu <= 7 && item.gridSlot >= 1 && item.gridSlot <= 9) {
        const cell = document.getElementById(`cell-${item.thu}-${item.gridSlot}`);
        if (cell) {
          const afternoonClass = item.isAfternoon ? 'cell-afternoon' : '';
          cell.innerHTML += `
            <div class="cell-occupied ${afternoonClass}">
              <div class="cell-subject">${item.subject}</div>
              <div class="cell-class">Lớp ${item.className}</div>
            </div>
          `;
        }
      }
    });
  }

  document.getElementById('searchInput').addEventListener('input', function(e) {
    filterTeacherDropdown(e.target.value);
  });

  document.getElementById('teacherSelect').addEventListener('change', function(e) {
    renderScheduleForTeacher(e.target.value);
  });

  window.onload = function() {
    buildEmptyGrid();

    // Phân tích và gộp dữ liệu từ toàn bộ 6 file CSV
    let allRecords = [];
    rawDataFiles.forEach(csvText => {
      allRecords = allRecords.concat(parseSchoolTKB(csvText));
    });
    scheduleData = allRecords;

    allTeachersList = [...new Set(scheduleData.map(r => r.teacher))]
      .filter(Boolean)
      .sort((a, b) => a.localeCompare(b, 'vi'));

    filterTeacherDropdown('');
    
    // Mặc định chọn B.Đ.Dương
    const defaultTeacher = allTeachersList.find(t => t.includes('B.Đ.Dương'));
    if (defaultTeacher) {
      document.getElementById('teacherSelect').value = defaultTeacher;
      renderScheduleForTeacher(defaultTeacher);
    }
  };
</script>

</body>
</html>
